<body>

<header>
  <div id="mdim"></div>

<script>

/* ===== 一鍵靜音（只關音樂和音效，不影響念字的語音）— 每天一分鐘遊戲統一做法 ===== */
(function(){
  var KEY='hg.mute.jigsaw', MOUNT='', muted=false, masters=[];
  try{ muted = localStorage.getItem(KEY)==='1'; }catch(e){}
  /* 讓這個遊戲建立的所有 Web Audio 聲音，都先經過一個總音量；靜音＝總音量 0 */
  try{
    var BP = window.BaseAudioContext ? window.BaseAudioContext.prototype : (window.AudioContext||window.webkitAudioContext).prototype;
    var desc = Object.getOwnPropertyDescriptor(BP,'destination');
    if(desc && desc.get){
      Object.defineProperty(BP,'destination',{configurable:true,get:function(){
        var real = desc.get.call(this);
        if(!this.__hgMaster){
          try{ var g=this.createGain(); g.gain.value = muted?0:1; g.connect(real); this.__hgMaster=g; masters.push(g); }
          catch(e){ return real; }
        }
        return this.__hgMaster;
      }});
    }
  }catch(e){}
  /* 備用的 <audio> 播放（例如 iPhone 的 Chrome）也一起靜音 */
  try{
    var op = HTMLMediaElement.prototype.play;
    HTMLMediaElement.prototype.play = function(){ this.muted = muted; return op.apply(this, arguments); };
  }catch(e){}
  function apply(){ masters.forEach(function(g){ try{ g.gain.setValueAtTime(muted?0:1, g.context.currentTime); }catch(e){ g.gain.value = muted?0:1; } }); }
  function build(){
    if(document.getElementById('hgMute')) return;
    var st=document.createElement('style');
    st.textContent='#hgMute{position:fixed;right:10px;top:112px;z-index:2147483000;width:40px;height:40px;border-radius:50%;border:1px solid rgba(0,0,0,.28);background:rgba(255,255,255,.88);color:#222;font-size:19px;line-height:1;padding:0;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25);touch-action:manipulation;-webkit-tap-highlight-color:transparent}#hgMute:active{transform:scale(.94)}#hgMute.st{position:static;flex:0 0 40px;margin:0 0 0 8px}';
    document.head.appendChild(st);
    var b=document.createElement('button'); b.type='button'; b.id='hgMute';
    function paint(){ b.textContent = muted?'🔇':'🔊'; b.setAttribute('aria-pressed', muted?'true':'false');
      b.title = b.ariaLabel = muted ? '開啟音樂和音效 · Activar música y efectos' : '靜音（音樂和音效）· Silenciar música y efectos'; apply(); }
    b.addEventListener('click',function(e){ e.stopPropagation(); muted=!muted; try{ localStorage.setItem(KEY, muted?'1':'0'); }catch(err){} paint(); });
    b.addEventListener('pointerdown',function(e){ e.stopPropagation(); });
    paint();
    var anchor = MOUNT && document.querySelector(MOUNT);
    if(anchor && anchor.parentNode){ b.className='st'; anchor.parentNode.insertBefore(b, anchor.nextSibling); } else document.body.appendChild(b);
  }
  if(document.body) build(); else document.addEventListener('DOMContentLoaded', build);
})();

  /* ---------- 拼音 → 注音 ---------- */
  const ZY_INIT = { b:'ㄅ',p:'ㄆ',m:'ㄇ',f:'ㄈ',d:'ㄉ',t:'ㄊ',n:'ㄋ',l:'ㄌ',g:'ㄍ',k:'ㄎ',h:'ㄏ',

    iang:'ㄧㄤ',ing:'ㄧㄥ',iong:'ㄩㄥ',u:'ㄨ',ua:'ㄨㄚ',uo:'ㄨㄛ',uai:'ㄨㄞ',uei:'ㄨㄟ',uan:'ㄨㄢ',
    uen:'ㄨㄣ',uang:'ㄨㄤ',ueng:'ㄨㄥ','ü':'ㄩ','üe':'ㄩㄝ','üan':'ㄩㄢ','ün':'ㄩㄣ' };

  // 輸入像 "zhong1"、"nü3"、"de0"（0 或沒有數字＝輕聲），輸出注音；轉不出來就回傳 ''
  function toZhuyin(py) {
    let m = /^([a-zü]+?)([0-5]?)$/.exec((py || '').toLowerCase().replace(/v/g, 'ü'));
    if (!m) return '';
    let s = m[1], tone = m[2] === '' ? 0 : +m[2];
    let ini = '';
    if (s.startsWith('yi')) s = s.slice(1);
    else if (s.startsWith('yu')) s = 'ü' + s.slice(2);
    else if (s.startsWith('y')) s = 'i' + s.slice(1);
    else if (s === 'wu') s = 'u';
    else if (s.startsWith('w')) s = 'u' + s.slice(1);
    else {
      const two = s.slice(0, 2);
      if (two === 'zh' || two === 'ch' || two === 'sh') ini = two;
      else if (ZY_INIT[s[0]]) ini = s[0];
      s = s.slice(ini.length);
      if (ini && 'jqx'.includes(ini)) s = s.replace(/^u/, 'ü');
      if (ini && (ini === 'n' || ini === 'l')) s = s.replace(/^ue$/, 'üe');
      if (ini) s = s.replace(/^iu$/, 'iou').replace(/^ui$/, 'uei').replace(/^un$/, 'uen');
    }
    let fin;
    if (s === '' || (s === 'i' && 'zh ch sh r z c s'.split(' ').includes(ini))) fin = '';
    else if (ZY_FINAL[s] !== undefined) fin = ZY_FINAL[s];

  const HE_WORDS = {
    '和平': 'hé píng', '和氣': 'hé qì', '和諧': 'hé xié', '溫和': 'wēn hé', '暖和': 'nuǎn huo', '和善': 'hé shàn',

  /* ---------- 卡榫形狀 ---------- */
  // 每一段是 [控制點1 t,h, 控制點2 t,h, 終點 t,h]，t 沿著邊、h 往外凸出（以邊長為單位）
  const TAB = [
    [.40, .00, .44, .02, .44, .07],
    [.44, .11, .38, .10, .38, .17],
    [.38, .25, .44, .29, .50, .29],
    [.56, .29, .62, .25, .62, .17],
    [.62, .10, .56, .11, .56, .07],
    [.56, .02, .60, .00, .64, .00]
  ];

  function edge(p, x0, y0, x1, y1, nx, ny, ed, rev, len) {
    if (!ed) { p.lineTo(x1, y1); return; }
    const j = rev ? -ed.j : ed.j;
    const f = (t, h) => [
      x0 + (x1 - x0) * (t + j) + nx * ed.s * h * len,
      y0 + (y1 - y0) * (t + j) + ny * ed.s * h * len
    ];
    let a = f(.36, 0);
    p.lineTo(a[0], a[1]);
    for (const s of TAB) {
      const c1 = f(s[0], s[1]), c2 = f(s[2], s[3]), e = f(s[4], s[5]);
      p.bezierCurveTo(c1[0], c1[1], c2[0], c2[1], e[0], e[1]);
    }
    p.lineTo(x1, y1);
  }

  function makePath(P, e) {
    const p = new Path2D();
    p.moveTo(0, 0);
    edge(p, 0, 0, P, 0, 0, -1, e.top, false, P);
    edge(p, P, 0, P, P, 1, 0, e.right, false, P);
    edge(p, P, P, 0, P, 0, 1, e.bottom, true, P);
    edge(p, 0, P, 0, 0, -1, 0, e.left, true, P);
    p.closePath();
    return p;
  }

  /* ---------- 產生拼圖圖片 ---------- */
  function roundRect(x, X, Y, w, h, r) {
    x.beginPath();
    x.moveTo(X + r, Y);
    x.arcTo(X + w, Y, X + w, Y + h, r);
    x.arcTo(X + w, Y + h, X, Y + h, r);
    x.arcTo(X, Y + h, X, Y, r);
    x.arcTo(X, Y, X + w, Y, r);
    x.closePath();
  }

  function makeImage(chars, S, ann) {
    const c = document.createElement('canvas');
    c.width = c.height = Math.round(S * RES);
    const x = c.getContext('2d');
    x.scale(RES, RES);
    const hue = Math.random() * 360;

    const g = x.createLinearGradient(0, 0, S, S);
    g.addColorStop(0, `hsl(${hue},85%,74%)`);
    g.addColorStop(.5, `hsl(${(hue + 55) % 360},85%,80%)`);
    g.addColorStop(1, `hsl(${(hue + 120) % 360},80%,72%)`);
    x.fillStyle = g;
    x.fillRect(0, 0, S, S);

    // 隨機花紋，讓每一片都有辨識特徵
    for (let i = 0; i < 70; i++) {
      const cx = Math.random() * S, cy = Math.random() * S;
      const r = S * (.02 + Math.random() * .08);
      const col = `hsla(${(hue + Math.random() * 220) % 360},80%,${45 + Math.random() * 35}%,${.18 + Math.random() * .25})`;
      x.fillStyle = col; x.strokeStyle = col;
      const k = i % 3;
      x.beginPath();
      if (k === 0) { x.arc(cx, cy, r, 0, Math.PI * 2); x.fill(); }
      else if (k === 1) { x.moveTo(cx, cy - r); x.lineTo(cx + r, cy); x.lineTo(cx, cy + r); x.lineTo(cx - r, cy); x.closePath(); x.fill(); }
      else { x.lineWidth = r * .3; x.arc(cx, cy, r, 0, Math.PI * 2); x.stroke(); }
    }
    for (let i = 0; i < 5; i++) {
      const y0 = S * (i + .5) / 5;
      x.beginPath();
      for (let u = 0; u <= S; u += 8) {
        const v = y0 + Math.sin(u / S * Math.PI * (2 + i) + i) * S * .04;
        if (u === 0) x.moveTo(u, v); else x.lineTo(u, v);
      }
      x.strokeStyle = 'rgba(255,255,255,.35)';
      x.lineWidth = S * .012;
      x.stroke();
    }

    // 文字：由左至右、由上到下
    const n = chars.length;
    const perRow = Math.ceil(Math.sqrt(n));
    const rowsN = Math.ceil(n / perRow);
    const cell = S / perRow;
    const y0 = (S - rowsN * cell) / 2;
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    // 有拼音／注音時字小一點，上方留位置（一行或兩行）
    const nl = ann ? (ann.py ? 1 : 0) + (ann.zy ? 1 : 0) : 0;
    const k = [.86, .68, .56][nl];
    chars.forEach((ch, i) => {
      const r = Math.floor(i / perRow), cc = i % perRow;
      const inRow = (r === rowsN - 1) ? n - (rowsN - 1) * perRow : perRow;
      const xo = (perRow - inRow) * cell / 2;       // 最後一行置中（閱讀順序不變）
      const cx = xo + (cc + .5) * cell, cy = y0 + (r + .5) * cell;
      x.fillStyle = 'rgba(255,255,255,.55)';
      roundRect(x, cx - cell * .49, cy - cell * .49, cell * .98, cell * .98, cell * .12);
      x.fill();
      const ty = cy + cell * [.04, .12, .17][nl];
      x.font = `900 ${cell * k}px ${FONT}`;
      x.lineJoin = 'round';
      x.lineWidth = cell * .08;
      x.strokeStyle = '#fff';
      x.strokeText(ch, cx, ty);
      x.fillStyle = `hsl(${(hue + 200 + i * 41) % 360},65%,28%)`;
      x.fillText(ch, cx, ty);
      if (nl) {
        const lines = [];
        if (ann.py && ann.py[i] && ann.py[i] !== ch) lines.push(ann.py[i]);
        if (ann.zy && ann.zy[i]) lines.push(ann.zy[i]);
        const size = cell * (nl === 1 ? .2 : .15);
        const ys = nl === 1 ? [-.34] : [-.40, -.25];
        // 只有一行可寫時（例如沒有注音），放在第一行的位置
        lines.forEach((txt, j) => {
          const yy = cy + cell * ys[j + (nl === 2 && lines.length === 1 && !(ann.py && ann.py[i] && ann.py[i] !== ch) ? 1 : 0)];
          x.font = `700 ${size}px ${FONT}`;
          x.lineWidth = cell * .05;
          x.strokeStyle = '#fff';
          x.strokeText(txt, cx, yy, cell * .92);
          x.fillStyle = '#1f2d3a';
          x.fillText(txt, cx, yy, cell * .92);
        });
      }
    });
    return c;
  }

  /* ---------- 開新遊戲 ---------- */
  function newGame() {
    let chars = Array.from((inText.value || '').replace(/\s+/g, '')).slice(0, 20);
    if (!chars.length) chars = Array.from(DEFAULT_TEXT);
    inText.value = chars.join('');

    const n = parseInt(selGrid.value, 10);
    const cols = n, rows = n, N = n * n;
    const level = settings.level === 'rot' ? 'rot' : 'easy';
    const rotOn = level === 'rot';
    const poolW = Math.round(clamp(W * .27, 250, 400));
    const tableW = W - poolW;
    const S0 = Math.min(H * .86, tableW * .84, 700);
    const P = isMobile ? 46 : Math.max(24, Math.floor(S0 / n));
    const S = P * n;
    const m = Math.ceil(P * .3) + 3;
    const sw = P + 2 * m;
    RES = isMobile ? clamp(DPR * 1.5, 2, 3) : DPR;
    let ann = null;
    if (settings.phon !== 'off' && window.pinyinPro) {
      try {
        applyTaiwanReadings();
        const str = chars.join('');
        const py = settings.phon !== 'zhuyin' ? twReadings(str, 'symbol') : null;
        const zy = settings.phon !== 'pinyin' ? twReadings(str, 'num').map(toZhuyin) : null;
        if ((!py || py.length === chars.length) && (!zy || zy.length === chars.length)) ann = { py, zy };
      } catch (err) { ann = null; }
    }
    const img = makeImage(chars, S, ann);

    // 邊的凸凹（相鄰兩片共用同一條邊，所以一定吻合）
    const rnd = () => ({ s: Math.random() < .5 ? 1 : -1, j: (Math.random() - .5) * .12 });
    const h = [], v = [];
    for (let r = 0; r < rows - 1; r++) { h[r] = []; for (let c = 0; c < cols; c++) h[r][c] = rnd(); }
    for (let r = 0; r < rows; r++) { v[r] = []; for (let c = 0; c < cols - 1; c++) v[r][c] = rnd(); }

    const pieces = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const e = {
          top:    r > 0        ? { s: -h[r - 1][c].s, j: h[r - 1][c].j } : null,
          bottom: r < rows - 1 ? { s:  h[r][c].s,     j: h[r][c].j }     : null,
          left:   c > 0        ? { s: -v[r][c - 1].s, j: v[r][c - 1].j } : null,
          right:  c < cols - 1 ? { s:  v[r][c].s,     j: v[r][c].j }     : null
        };
        const path = makePath(P, e);

        // 預先畫好每一片的外觀
        const sc = document.createElement('canvas');
        sc.width = sc.height = Math.ceil(sw * RES);
        const sx = sc.getContext('2d');
        sx.scale(RES, RES);
        sx.translate(m, m);
        sx.save();
        sx.clip(path);
        sx.drawImage(img, -c * P, -r * P, S, S);
        sx.lineJoin = 'round';
        sx.translate(1, 1);
        sx.lineWidth = 2.5;
        sx.strokeStyle = 'rgba(255,255,255,.38)';
        sx.stroke(path);
        sx.translate(-2, -2);
        sx.strokeStyle = 'rgba(0,0,0,.25)';
        sx.stroke(path);
        sx.restore();
        sx.lineWidth = .9;
        sx.strokeStyle = 'rgba(0,0,0,.5)';
        sx.stroke(path);

        const corner = (r === 0 || r === rows - 1) && (c === 0 || c === cols - 1);
        const border = r === 0 || r === rows - 1 || c === 0 || c === cols - 1;
        pieces.push({
          id: r * cols + c, r, c, x: 0, y: 0, pool: true, g: r * cols + c, rot: rotOn ? Math.floor(Math.random() * 4) : 0,
          path, sprite: sc, flash: 0, type: corner ? 0 : (border ? 1 : 2)
        });
      }
    }

    G = {
      cols, rows, N, n, P, S, m, sw, poolW, img, pieces, text: chars.join(''), moves: 0, level, rotOn,
      order: pieces.map(p => p.id).sort(() => Math.random() - .5),
      scroll: 0, start: performance.now(), done: false, elapsed: 0,
      view: { x: 0, y: 0, s: 1 }, fx: 0, fy: 0, trayOpen: true, trayFull: Math.ceil(24 + 2 * P * 1.2 + 2 * m), trayH: 0, trayTop: 0,
      mobile: false, bottom: false
    };
    calcLayout();
    if (isMobile) { G.fx = G.fy = 0; fitView(); }
    else { G.fx = G.poolW + (W - G.poolW - S) / 2; G.fy = (H - S) / 2; }

    // 初始散落在拼圖池
    layoutPool();

    drag = null;
    lastResult = null;
    winEl.classList.add('hidden');
    showMoves();
    startTimer();
    updateStatus();
    showHint();
    requestDraw();
  }

  /* ---------- 計時器 ---------- */
  function fmt(ms) {
    const s = Math.floor(ms / 1000);
    const hh = Math.floor(s / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60;
    const p = v => String(v).padStart(2, '0');
    return (hh ? p(hh) + ':' : '') + p(mm) + ':' + p(ss);
  }
  function startTimer() {
    clearInterval(timerId);
    timerEl.textContent = '⏱ 00:00';
    timerId = setInterval(() => {
      if (!G || G.done) return;
      G.elapsed = performance.now() - G.start;
      timerEl.textContent = '⏱ ' + fmt(G.elapsed);
    }, 250);
  }

  /* ---------- 狀態列 ---------- */
  function updateStatus() {
    if (!G) return;
    const cnt = new Map();
    let pc = 0;
    for (const p of G.pieces) {
      cnt.set(p.g, (cnt.get(p.g) || 0) + 1);
      if (p.pool) pc++;
    }
    const big = Math.max(...cnt.values());
    const line = (i) => ['largest', 'inPool', 'onTable'].map((k, j) => {
      const v = j === 0 ? (i === 0 ? `${Math.floor(big * 100 / G.N)}%` : `${big} / ${G.N}`) : (j === 1 ? pc : G.N - pc);
      return `${bi(k)[i]}: ${v}`;
    }).join(i === 0 ? '　' : ' · ');
    statusEl.innerHTML = '';
    const l1 = document.createElement('div'); l1.textContent = line(0);
    const l2 = document.createElement('small'); l2.textContent = line(1);
    statusEl.append(l1, l2);
  }

  /* ---------- 繪圖 ---------- */
  function requestDraw() { if (!raf) raf = requestAnimationFrame(draw); }

  function drawPiece(p, x, y) {
    const k = p.rot | 0;
    if (!k) { ctx.drawImage(p.sprite, x - G.m, y - G.m, G.sw, G.sw); return; }
    const h = G.P / 2;
    ctx.save();
    ctx.translate(x + h, y + h);
    ctx.rotate(k * Math.PI / 2);
    ctx.drawImage(p.sprite, -h - G.m, -h - G.m, G.sw, G.sw);
    ctx.restore();
  }

  // 拼圖池座標 ⇄ 螢幕座標（電腦版／手機橫放：池在左邊、上下捲動；手機直放：池是下方托盤、左右捲動）
  function poolToScreen(px, py) { return G.bottom ? [px - G.scroll, G.trayTop + py] : [px, py - G.scroll]; }
  function screenToPool(sx, sy) { return G.bottom ? [sx + G.scroll, sy - G.trayTop] : [sx, sy + G.scroll]; }
  function ta() { return G.bottom ? { x0: 0, y0: 0, x1: W, y1: G.trayTop } : { x0: G.poolW, y0: 0, x1: W, y1: H }; }
  function inTA(mx, my) { const t = ta(); return mx >= t.x0 && mx < t.x1 && my >= t.y0 && my < t.y1; }
  function overPool(mx, my) { return G.bottom ? (G.trayOpen && my >= G.trayTop) : mx < G.poolW; }
  function inPoolBody(mx, my) { return G.bottom ? (G.trayOpen && my >= G.trayTop + 24) : (mx < G.poolW - 8 && my >= 44); }

  function maxScroll() {
    let b = 0;
    if (G.bottom) {
      for (const p of G.pieces) if (p.pool) b = Math.max(b, p.x + G.P + G.m);
      return Math.max(0, b + 12 - W);
    }
    for (const p of G.pieces) if (p.pool) b = Math.max(b, p.y + G.P + G.m);
    return Math.max(0, b + 16 - H);
  }
  function clampScroll() { G.scroll = clamp(G.scroll, 0, maxScroll()); }

  function calcLayout() {
    G.mobile = isMobile;
    G.bottom = isMobile && H > W;
    if (G.bottom) {
      G.trayH = G.trayOpen ? G.trayFull : 26;
      G.trayTop = H - G.trayH;
      G.poolW = 0;
    } else {
      G.poolW = isMobile ? Math.round(clamp(W * .26, 160, 240)) : Math.round(clamp(W * .27, 250, 400));
      G.trayH = 0; G.trayTop = H;
    }
  }
  function worldBounds() {
    const S = G.S;
    let x0 = G.fx - S, y0 = G.fy - S, x1 = G.fx + 2 * S, y1 = G.fy + 2 * S;
    for (const p of G.pieces) if (!p.pool) {
      x0 = Math.min(x0, p.x - G.P); y0 = Math.min(y0, p.y - G.P);
      x1 = Math.max(x1, p.x + 2 * G.P); y1 = Math.max(y1, p.y + 2 * G.P);
    }
    return { x0, y0, x1, y1 };
  }
  function clampView() {
    if (!G || !G.mobile) return;
    const t = ta(), B = worldBounds(), v = G.view, s = v.s;
    const minX = t.x1 - B.x1 * s, maxX = t.x0 - B.x0 * s;
    const minY = t.y1 - B.y1 * s, maxY = t.y0 - B.y0 * s;
    v.x = minX > maxX ? (minX + maxX) / 2 : clamp(v.x, minX, maxX);
    v.y = minY > maxY ? (minY + maxY) / 2 : clamp(v.y, minY, maxY);
  }
  function fitView() {
    const t = ta(), S = G.S, v = G.view;
    v.s = clamp(Math.min(t.x1 - t.x0, t.y1 - t.y0) * .94 / S, .25, 1.4);
    v.x = t.x0 + ((t.x1 - t.x0) - S * v.s) / 2 - G.fx * v.s;
    v.y = t.y0 + ((t.y1 - t.y0) - S * v.s) / 2 - G.fy * v.s;
  }
  // 初始把所有片散落在拼圖池
  function layoutPool() {
    const { P, m, pieces } = G, cell = P * 1.2;
    if (G.bottom) {
      G.order.forEach((id, i) => {
        const p = pieces[id];
        p.x = 12 + m + Math.floor(i / 2) * cell + (Math.random() - .5) * P * .1;
        p.y = 24 + m + 4 + (i % 2) * cell + (Math.random() - .5) * P * .08;
      });
      return;
    }
    const usable = G.poolW - 16 - 2 * m;
    const cp = Math.max(1, Math.floor((usable - P) / cell) + 1);
    const totalW = (cp - 1) * cell + P;
    const x0 = 8 + m + (usable - totalW) / 2;
    G.order.forEach((id, i) => {
      const p = pieces[id];
      p.x = x0 + (i % cp) * cell + (Math.random() - .5) * P * .12;
      p.y = 50 + m + Math.floor(i / cp) * cell + (Math.random() - .5) * P * .12;
    });
  }
  // 視窗大小或方向改變（手機直放／橫放）
  function onResizeGame() {
    if (!G.mobile && !isMobile) return;           // 電腦版維持原樣
    const oldKey = G.mobile + '/' + G.bottom, ofx = G.fx, ofy = G.fy;
    calcLayout();
    if (oldKey !== G.mobile + '/' + G.bottom) {
      tidy('plain');
      if (G.mobile) {
        G.fx = G.fy = 0;
        for (const p of G.pieces) if (!p.pool) { p.x -= ofx; p.y -= ofy; }
        fitView();
      } else {
        G.view = { x: 0, y: 0, s: 1 };
        G.fx = G.poolW + (W - G.poolW - G.S) / 2; G.fy = (H - G.S) / 2;
        for (const p of G.pieces) if (!p.pool) { p.x += G.fx - ofx; p.y += G.fy - ofy; }
      }
    }
    clampView(); clampScroll();
  }
  function toggleTray() {
    if (!G || !G.bottom) return;
    G.trayOpen = !G.trayOpen;
    calcLayout(); clampView(); requestDraw();
  }
  let hintTimer = 0;
  function showHint() {
    const el = $('mhint');
    clearTimeout(hintTimer);
    if (!isMobile || !G) { el.classList.remove('show', 'fade'); return; }
    const [z, o] = bi('mHint'), [z2, o2] = bi('mHintRot');
    el.innerHTML = '';
    const l1 = document.createElement('div'); l1.textContent = z + (G.rotOn ? z2 : '');
    el.appendChild(l1);
    if (o) { const l2 = document.createElement('small'); l2.style.fontWeight = '400'; l2.textContent = o + (G.rotOn ? o2 : ''); el.appendChild(l2); }
    el.classList.remove('fade'); el.classList.add('show');
    hintTimer = setTimeout(() => { el.classList.add('fade'); hintTimer = setTimeout(() => el.classList.remove('show'), 700); }, 6000);
  }

  function draw() {
    raf = 0;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;

    // 桌面（綠色桌布）
    ctx.fillStyle = '#2f5d4f';
    ctx.fillRect(0, 0, W, H);
    if (noisePattern) { ctx.fillStyle = noisePattern; ctx.fillRect(0, 0, W, H); }
    if (!G) return;

    const now = performance.now();
    let anim = false;
    const pw = G.poolW, v = G.view;
    const dragging = drag && drag.mode === 'piece' ? drag.set : null;

    // 提示框
    if (showFrame) {
      ctx.save();
      ctx.translate(v.x, v.y); ctx.scale(v.s, v.s);
      ctx.setLineDash([10, 7]);
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(255,255,255,.55)';
      ctx.strokeRect(G.fx, G.fy, G.S, G.S);
      ctx.restore();
    }

    // 文字太長就縮小字級，直到放得進寬度
    const fit = (txt, px, weight, minPx, maxW) => {
      let sz = px;
      for (; sz > minPx; sz -= .5) {
        ctx.font = `${weight} ${sz}px ${FONT}`;
        if (ctx.measureText(txt).width <= maxW) break;
      }
      ctx.font = `${weight} ${sz}px ${FONT}`;
    };

    const drawPool = () => {
      let pc = 0;
      for (const p of G.pieces) if (p.pool) pc++;
      if (G.bottom) {
        // 手機直放：下方托盤
        const ty = G.trayTop, open = G.trayOpen, hh = open ? 24 : 26;
        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,.5)';
        ctx.shadowBlur = 12; ctx.shadowOffsetY = -3;
        ctx.fillStyle = '#7a5c3a';
        ctx.fillRect(0, ty, W, G.trayH);
        ctx.restore();
        if (open) {
          ctx.fillStyle = '#b8905f';
          ctx.fillRect(0, ty + 24, W, G.trayH - 24);
          ctx.save();
          ctx.beginPath();
          ctx.rect(0, ty + 24, W, G.trayH - 24);
          ctx.clip();
          for (const id of G.order) {
            const p = G.pieces[id];
            if (!p.pool) continue;
            ctx.shadowColor = 'rgba(0,0,0,.35)';
            ctx.shadowOffsetX = 1; ctx.shadowOffsetY = 2; ctx.shadowBlur = 0;
            drawPiece(p, p.x - G.scroll, ty + p.y);
          }
          ctx.restore();
          const ms = maxScroll();
          if (ms > 0) {
            const trackW = W - 24;
            const thumb = Math.max(30, trackW * W / (W + ms));
            const tx = 12 + (trackW - thumb) * (G.scroll / ms);
            ctx.fillStyle = 'rgba(0,0,0,.35)';
            roundRect(ctx, tx, ty + G.trayH - 7, thumb, 4, 2);
            ctx.fill();
          }
        }
        ctx.fillStyle = '#5d4529';
        ctx.fillRect(0, ty, W, hh);
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        const title = `${T('pool')} (${pc})`;
        fit(title, 12, 'bold', 8, W - 60);
        ctx.fillText(title, 10, ty + hh / 2 + 1);
        ctx.font = `bold 13px ${FONT}`;
        ctx.textAlign = 'right';
        ctx.fillText(open ? '▼' : '▲', W - 12, ty + hh / 2 + 1);
        ctx.textAlign = 'left';
        return;
      }
      // 左邊的拼圖池（紙盒蓋）
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,.5)';
      ctx.shadowBlur = 14; ctx.shadowOffsetX = 3;
      ctx.fillStyle = '#7a5c3a';
      ctx.fillRect(0, 0, pw, H);
      ctx.restore();
      ctx.fillStyle = '#b8905f';
      ctx.fillRect(8, 8, pw - 16, H - 16);
      ctx.strokeStyle = 'rgba(0,0,0,.25)';
      ctx.lineWidth = 2;
      ctx.strokeRect(8, 8, pw - 16, H - 16);

      // 池中的拼圖（可捲動、裁切在盒內）
      ctx.save();
      ctx.beginPath();
      ctx.rect(8, 44, pw - 16, H - 52);
      ctx.clip();
      for (const id of G.order) {
        const p = G.pieces[id];
        if (!p.pool) continue;
        ctx.shadowColor = 'rgba(0,0,0,.35)';
        ctx.shadowOffsetX = 1; ctx.shadowOffsetY = 2; ctx.shadowBlur = 0;
        drawPiece(p, p.x, p.y - G.scroll);
      }
      ctx.restore();

      // 池標題列
      ctx.fillStyle = '#5d4529';
      ctx.fillRect(8, 8, pw - 16, 36);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      const poolTitle = `${T('pool')} (${pc})`;
      fit(poolTitle, 14, 'bold', 9, pw - 32);
      ctx.fillText(poolTitle, 16, 20);
      ctx.fillStyle = 'rgba(255,255,255,.7)';
      const hint = T(G.rotOn ? 'poolHintRot' : 'poolHint');
      fit(hint, 10.5, 'normal', 8, pw - 32);
      ctx.fillText(hint, 16, 35);

      // 捲軸
      const ms = maxScroll();
      if (ms > 0) {
        const trackH = H - 60;
        const thumb = Math.max(30, trackH * H / (H + ms));
        const ty = 48 + (trackH - thumb) * (G.scroll / ms);
        ctx.fillStyle = 'rgba(0,0,0,.35)';
        roundRect(ctx, pw - 13, ty, 5, thumb, 2.5);
        ctx.fill();
      }
    };

    // 桌上的拼圖（mode：'all' 全部、'still' 沒被拿著的、'drag' 拿在手上的）
    const drawTable = (mode) => {
      ctx.save();
      ctx.translate(v.x, v.y); ctx.scale(v.s, v.s);
      for (const id of G.order) {
        const p = G.pieces[id];
        if (p.pool) continue;
        const isDrag = !!(dragging && dragging.has(id));
        if (mode === 'still' && isDrag) continue;
        if (mode === 'drag' && !isDrag) continue;
        if (isDrag) {
          ctx.shadowColor = 'rgba(0,0,0,.45)';
          ctx.shadowOffsetX = 5; ctx.shadowOffsetY = 8;
          ctx.shadowBlur = drag.members.length <= 80 ? 10 : 0;
        } else if (p.flash > now) {
          const a = (p.flash - now) / 600;
          ctx.shadowColor = `rgba(255,240,120,${a})`;
          ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
          ctx.shadowBlur = 16 * a;
          anim = true;
        } else {
          ctx.shadowColor = 'rgba(0,0,0,.35)';
          ctx.shadowOffsetX = 1; ctx.shadowOffsetY = 2; ctx.shadowBlur = 0;
        }
        drawPiece(p, p.x, p.y);
      }
      ctx.restore();
    };

    if (G.mobile) {
      // 手機：桌上的片先畫（裁在桌面範圍內），再畫拼圖池，拿在手上的最後畫
      const t = ta();
      ctx.save();
      ctx.beginPath();
      ctx.rect(t.x0, t.y0, t.x1 - t.x0, t.y1 - t.y0);
      ctx.clip();
      drawTable('still');
      ctx.restore();
      drawPool();
      drawTable('drag');
    } else {
      drawPool();
      drawTable('all');
    }
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;

    // 完成圖
    if (showPreview) {
      let size, px, py;
      if (G.mobile) {
        const t = ta();
        size = Math.min(t.x1 - t.x0, t.y1 - t.y0) * .8;
        px = t.x0 + ((t.x1 - t.x0) - size) / 2; py = t.y0 + ((t.y1 - t.y0) - size) / 2;
      } else {
        size = clamp((W - pw) * .2, 120, 210);
        px = W - size - 20; py = 20;
      }
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,.5)';
      ctx.shadowBlur = 12; ctx.shadowOffsetY = 4;
      ctx.fillStyle = '#fff';
      ctx.fillRect(px - 6, py - 6, size + 12, size + 12);
      ctx.restore();
      ctx.drawImage(G.img, px, py, size, size);
    }

    if (anim) requestDraw();
  }

  /* ---------- 點選判斷 ---------- */
  const ptrs = new Map();
  const hover = { x: 0, y: 0, on: false };
  function pos(e) {
    const r = cv.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  }

  function hit(mx, my) {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const v = G.view, hh = G.P / 2, fat = G.mobile ? 12 : 6;
    const poolOk = inPoolBody(mx, my), tableOk = !G.mobile || inTA(mx, my);
    let found = null;
    for (let i = G.order.length - 1; i >= 0; i--) {
      const p = G.pieces[G.order[i]];
      let sx, sy, sc;
      if (p.pool) {
        if (!poolOk) continue;
        [sx, sy] = poolToScreen(p.x, p.y); sc = 1;
      } else {
        if (!tableOk) continue;
        sx = p.x * v.s + v.x; sy = p.y * v.s + v.y; sc = v.s;
      }
      let dx = (mx - (sx + hh * sc)) / sc, dy = (my - (sy + hh * sc)) / sc;
      for (let k = p.rot | 0; k > 0; k--) { const t = dx; dx = dy; dy = -t; }   // 轉回正的方向再判斷
      const lx = dx + hh, ly = dy + hh;
      ctx.lineWidth = fat / sc;
      if (ctx.isPointInPath(p.path, lx, ly) || ctx.isPointInStroke(p.path, lx, ly)) { found = p; break; }
    }
    ctx.restore();
    return found;
  }

  /* ---------- 拖曳 ---------- */
  function startPinch() {
    const pts = [...ptrs.entries()];
    const a = pts[0][1], b = pts[1][1];
    drag = { mode: 'pinch', ids: [pts[0][0], pts[1][0]], d0: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1,
      s0: G.view.s, cx0: (a[0] + b[0]) / 2, cy0: (a[1] + b[1]) / 2, vx0: G.view.x, vy0: G.view.y };
  }

  cv.addEventListener('pointerdown', e => {
    if (!G || e.button > 0) return;
    const [mx, my] = pos(e);
    ptrs.set(e.pointerId, [mx, my]);
    const touch = e.pointerType !== 'mouse';
    if (ptrs.size === 2 && touch) {
      if (drag && drag.mode === 'piece') { if (G.rotOn && !G.done) rotateMembers(drag.members, 1, drag.anchor); return; }   // 手上拖著片子，另一指點一下＝轉
      if (drag && drag.mode === 'scroll') return;
      if (G.mobile) { startPinch(); cv.setPointerCapture(e.pointerId); }
      return;
    }
    if (ptrs.size > 2) return;
    if (G.bottom && my >= G.trayTop && my < G.trayTop + (G.trayOpen ? 24 : 26)) { toggleTray(); return; }
    const p = hit(mx, my);
    if (p) {
      const members = G.pieces.filter(q => q.g === p.g);
      const set = new Set(members.map(q => q.id));
      // 拿起來，放到最上層
      G.order = G.order.filter(id => !set.has(id)).concat(members.map(q => q.id));
      let origin = null;
      if (p.pool) {
        // 從拼圖池拿起：換成桌面座標（片子的左上角保持在手指／滑鼠相對的位置）
        origin = { pts: members.map(q => [q.x, q.y]) };
        const [sx, sy] = poolToScreen(p.x, p.y);
        const wx = (mx - G.view.x) / G.view.s - (mx - sx), wy = (my - G.view.y) / G.view.s - (my - sy);
        const shx = wx - p.x, shy = wy - p.y;
        for (const q of members) { q.x += shx; q.y += shy; q.pool = false; }
      }
      drag = { mode: 'piece', pid: e.pointerId, members, set, anchor: p, origin, touch, lx: clamp(mx, 0, W), ly: clamp(my, 0, H), dist: 0, timer: 0 };
      if (G.mobile) drag.timer = setInterval(edgePan, 16);
      cv.style.cursor = 'grabbing';
      cv.setPointerCapture(e.pointerId);
      requestDraw();
    } else if (inPoolBody(mx, my) && maxScroll() > 0) {
      drag = { mode: 'scroll', pid: e.pointerId, startX: mx, startY: my, startScroll: G.scroll };
      cv.setPointerCapture(e.pointerId);
    } else if (G.mobile && inTA(mx, my)) {
      drag = { mode: 'pan', pid: e.pointerId, sx: mx, sy: my, vx: G.view.x, vy: G.view.y };
      cv.setPointerCapture(e.pointerId);
    }
  });

  // 拖著片子靠近桌面邊緣時，畫面自動跟著移動（手機）
  function edgePan() {
    if (!drag || drag.mode !== 'piece') return;
    const t = ta(), Z = 38, v = G.view, x = drag.lx, y = drag.ly;
    if (!inTA(x, y)) return;
    let px = 0, py = 0;
    if (x < t.x0 + Z) px = t.x0 + Z - x; else if (x > t.x1 - Z) px = -(x - (t.x1 - Z));
    if (y < t.y0 + Z) py = t.y0 + Z - y; else if (y > t.y1 - Z) py = -(y - (t.y1 - Z));
    px *= .25; py *= .25;
    if (!px && !py) return;
    const ox = v.x, oy = v.y;
    v.x += px; v.y += py; clampView();
    const rx = v.x - ox, ry = v.y - oy;
    if (!rx && !ry) return;
    for (const q of drag.members) { q.x -= rx / v.s; q.y -= ry / v.s; }   // 片子留在手指下
    requestDraw();
  }

  cv.addEventListener('pointermove', e => {
    if (!G) return;
    const [mx0, my0] = pos(e);
    if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, [mx0, my0]);
    hover.x = mx0; hover.y = my0; hover.on = true;
    if (!drag) {
      if (e.pointerType === 'mouse') cv.style.cursor = hit(mx0, my0) ? 'grab' : 'default';
      return;
    }
    if (drag.mode === 'pinch') {
      const a = ptrs.get(drag.ids[0]), b = ptrs.get(drag.ids[1]);
      if (!a || !b) return;
      const d = Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, cx = (a[0] + b[0]) / 2, cy = (a[1] + b[1]) / 2;
      const v = G.view, ns = clamp(drag.s0 * d / drag.d0, .25, 3.5);
      const wx = (drag.cx0 - drag.vx0) / drag.s0, wy = (drag.cy0 - drag.vy0) / drag.s0;
      v.s = ns; v.x = cx - wx * ns; v.y = cy - wy * ns;
      clampView(); requestDraw();
      return;
    }
    if (e.pointerId !== drag.pid) return;
    if (drag.mode === 'scroll') {
      G.scroll = clamp(drag.startScroll - (G.bottom ? mx0 - drag.startX : my0 - drag.startY), 0, maxScroll());
      requestDraw();
      return;
    }
    if (drag.mode === 'pan') {
      G.view.x = drag.vx + (mx0 - drag.sx); G.view.y = drag.vy + (my0 - drag.sy);
      clampView(); requestDraw();
      return;
    }
    const mx = clamp(mx0, 0, W), my = clamp(my0, 0, H);
    const dx = mx - drag.lx, dy = my - drag.ly, s = G.view.s;
    drag.lx = mx; drag.ly = my;
    drag.dist += Math.hypot(dx, dy);
    for (const q of drag.members) { q.x += dx / s; q.y += dy / s; }
    requestDraw();
  });
  cv.addEventListener('pointerleave', () => { hover.on = false; });

  function endDrag() {
    if (!drag) return;
    const d = drag;
    drag = null;
    clearInterval(d.timer);
    if (d.mode !== 'piece') return;
    const members = d.members, lx = d.lx, ly = d.ly, v = G.view;
    const tapTol = d.touch ? 10 : 6;
    cv.style.cursor = 'grab';
    if (d.origin && d.dist <= tapTol) {
      // 只是點一下拼圖池裡的片：放回原位（進階難度用手指點＝轉）
      members.forEach((q, i) => { q.x = d.origin.pts[i][0]; q.y = d.origin.pts[i][1]; q.pool = true; });
      if (d.touch && G.rotOn && !G.done) rotateMembers(members, 1, d.anchor);
      updateStatus(); requestDraw();
      return;
    }
    if (d.dist > tapTol && !G.done) { G.moves++; showMoves(); }   // 拿起、移動、放下 = 一次
    if (overPool(lx, ly)) {
      // 放進拼圖池：保持放開時的位置
      const a = d.anchor;
      const [px, py] = screenToPool(a.x * v.s + v.x, a.y * v.s + v.y);
      const shx = px - a.x, shy = py - a.y;
      for (const q of members) { q.x += shx; q.y += shy; q.pool = true; }
      nudgeIntoPool(members);
      clampScroll();
    } else if (d.touch && d.dist <= tapTol && G.rotOn && !G.done) {
      rotateMembers(members, 1, d.anchor);                       // 點一下桌上的片＝轉 90 度
    } else {
      trySnap(members[0].g);
    }
    updateStatus();
    checkWin();
    requestDraw();
  }
  function onUp(e) {
    ptrs.delete(e.pointerId);
    if (!drag) return;
    if (drag.mode === 'pinch') { if (drag.ids.includes(e.pointerId)) drag = null; return; }
    if (e.pointerId !== drag.pid) return;
    endDrag();
  }
  cv.addEventListener('pointerup', onUp);
  cv.addEventListener('pointercancel', onUp);

  /* ---------- 旋轉（進階難度）：R 鍵、滾輪、手機點一下 ---------- */
  // 以 (cx, cy) 為中心，把一組拼圖片轉 90 度（dir = 1 順時針、-1 逆時針）
  function rotateSet(members, dir, cx, cy) {
    const h = G.P / 2;
    for (const q of members) {
      const dx = q.x + h - cx, dy = q.y + h - cy;
      const nx = dir > 0 ? -dy : dy, ny = dir > 0 ? dx : -dx;
      q.x = cx + nx - h; q.y = cy + ny - h;
      q.rot = (((q.rot | 0) + dir) % 4 + 4) % 4;
    }
  }
  function rotSound() {
    if (!settings.sfx) return;
    const a = getCtx(); if (!a) return;
    try { if (a.state === 'suspended') a.resume(); tone(a, 330, 420, .06, .08, 'sine'); } catch (err) { /* ignore */ }
  }
  function rotateMembers(members, dir, pv) {
    rotateSet(members, dir, pv.x + G.P / 2, pv.y + G.P / 2);
    G.moves++; showMoves();
    rotSound();
    if (!drag && !pv.pool) { trySnap(pv.g); updateStatus(); checkWin(); }
    requestDraw();
  }
  function doRotate(dir, mx, my) {
    if (!G || !G.rotOn || G.done) return;
    if (drag && drag.mode === 'piece') { rotateMembers(drag.members, dir, drag.anchor); return; }
    const p = hit(mx, my);
    if (!p) return;
    rotateMembers(G.pieces.filter(q => q.g === p.g), dir, p);
  }
  // 電腦版：滑鼠雙擊拼圖片＝順時針轉 90 度（手機本來就是點一下轉，所以只收滑鼠）
  let lastPtrType = 'mouse';
  cv.addEventListener('pointerdown', e => { lastPtrType = e.pointerType; }, true);
  cv.addEventListener('dblclick', e => {
    if (lastPtrType !== 'mouse' || !G || !G.rotOn || G.done || drag) return;
    const [mx, my] = pos(e);
    doRotate(1, mx, my);
  });
  window.addEventListener('keydown', e => {
    if (!G || !G.rotOn || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key !== 'r' && e.key !== 'R') return;
    const t = e.target && e.target.tagName;
    if (t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA') return;
    if (!(drag && drag.mode === 'piece') && !hover.on) return;
    e.preventDefault();
    if (e.repeat) return;
    doRotate(e.shiftKey ? -1 : 1, hover.x, hover.y);
  });
  let wheelAcc = 0, wheelAt = 0;
  cv.addEventListener('wheel', e => {
    if (!G) return;
    const [mx, my] = pos(e);
    if (G.rotOn && !G.done && ((drag && drag.mode === 'piece') || !overPool(mx, my))) {
      e.preventDefault();
      wheelAcc += e.deltaY * (e.deltaMode === 1 ? 16 : 1);
      const now = performance.now();
      if (Math.abs(wheelAcc) >= 40 && now - wheelAt > 130) {
        doRotate(wheelAcc > 0 ? 1 : -1, mx, my);
        wheelAcc = 0; wheelAt = now;
      }
      return;
    }
    if (overPool(mx, my)) {
      e.preventDefault();
      G.scroll = clamp(G.scroll + (G.bottom ? (e.deltaX || e.deltaY) : e.deltaY), 0, maxScroll());
      requestDraw();
    }
  }, { passive: false });

  // 放進池子時，不要讓片子卡在盒子外面
  function nudgeIntoPool(members) {
    const m = G.m, P = G.P, pw = G.poolW;
    let minx = Infinity, maxx = -Infinity, miny = Infinity, maxy = -Infinity;
    for (const q of members) {
      minx = Math.min(minx, q.x); maxx = Math.max(maxx, q.x + P); miny = Math.min(miny, q.y); maxy = Math.max(maxy, q.y + P);
    }
    let dx = 0, dy = 0;
    if (G.bottom) {
      if (minx < 8 + m) dx = 8 + m - minx;
      if (maxy > G.trayH - m - 2) dy = G.trayH - m - 2 - maxy;
      if (miny + dy < 24 + m + 2) dy = 24 + m + 2 - miny;
    } else {
      if (maxx > pw - 8 - m) dx = pw - 8 - m - maxx;
      if (minx + dx < 8 + m) dx = 8 + m - minx;
      if (miny < 46 + m) dy = 46 + m - miny;
    }
    for (const q of members) { q.x += dx; q.y += dy; }
  }

  /* ---------- 相鄰吸附 ---------- */
  const DIRS = [[-1, 0], [1, 0], [0, -1], [0, 1]];

  function trySnap(gid) {
    const { P, cols, rows, pieces } = G;
    const tol = P * (SNAP[settings.snap] + (G.mobile ? .06 : 0));   // 手指比較不準，手機版多給一點
    let merged = false, guard = 0;
    while (guard++ < 500) {
      const mem = pieces.filter(q => q.g === gid);
      let found = null;
      outer:
      for (const p of mem) {
        for (const [dr, dc] of DIRS) {
          const r = p.r + dr, c = p.c + dc;
          if (r < 0 || c < 0 || r >= rows || c >= cols) continue;
          const q = pieces[r * cols + c];
          if (q.g === gid || q.pool) continue;
          if ((q.rot | 0) !== (p.rot | 0)) continue;     // 方向不同不能接
          let rx = dc * P, ry = dr * P;
          for (let k = p.rot | 0; k > 0; k--) { const t = rx; rx = -ry; ry = t; }   // 隨旋轉轉方向
          const ex = p.x + rx, ey = p.y + ry;           // q 正確的位置
          if (Math.hypot(q.x - ex, q.y - ey) < tol) { found = { q, mx: q.x - ex, my: q.y - ey }; break outer; }
        }
      }
      if (!found) break;
      // 把手上這塊「推」到定位，再接合
      for (const p of mem) { p.x += found.mx; p.y += found.my; }
      const other = found.q.g;
      const flash = performance.now() + 600;
      for (const q of pieces) { if (q.g === other) q.g = gid; }
      for (const q of pieces) { if (q.g === gid) q.flash = flash; }
      merged = true;
    }
    if (merged) {
      click();
      // 接好的整塊放到最上層
      const set = new Set(G.pieces.filter(q => q.g === gid).map(q => q.id));
      G.order = G.order.filter(id => !set.has(id)).concat([...set]);
    }
  }

  function checkWin() {
    if (G.done) return;
    const g0 = G.pieces[0].g;
    if (G.pieces.every(p => p.g === g0 && !p.pool)) {
      if (G.rotOn && G.pieces[0].rot) {                 // 全部接好但整張是歪的：自動轉正
        let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
        G.pieces.forEach(p => { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x + G.P); y1 = Math.max(y1, p.y + G.P); });
        for (let k = (4 - G.pieces[0].rot) % 4; k > 0; k--) rotateSet(G.pieces, 1, (x0 + x1) / 2, (y0 + y1) / 2);
      }
      G.done = true;
      G.elapsed = performance.now() - G.start;
      timerEl.textContent = '⏱ ' + fmt(G.elapsed);
      lastResult = { n: G.n, board: G.n + (G.rotOn ? 'r' : ''), secs: Math.max(30, Math.min(99999, Math.round(G.elapsed / 1000))),
        moves: Math.max(G.n * G.n, Math.min(9999, G.moves)), text: G.text, saved: false, saving: false, status: '' };
      try { nameInput.value = localStorage.getItem('jigsaw_name') || ''; } catch (e) { /* ignore */ }
      renderWinMsg();
      renderSave();
      winSound();
      const f = performance.now() + 600;
      G.pieces.forEach(p => { p.flash = f; });
      setTimeout(() => { winEl.classList.remove('hidden'); }, 700);
    }
  }

  /* ---------- 聲音：接合音效＋背景音樂（水滴聲與風聲，全部由程式合成） ---------- */
  let actx = null, music = null;
  function getCtx() {
    try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); return actx; } catch (e) { return null; }
  }
  function tone(a, f0, f1, dur, vol, type) {
    const o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime;
    o.type = type || 'triangle';
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(f1, t0 + dur * .7);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0 + dur + .02);
  }
  function click() {
    if (!settings.sfx) return;
    const a = getCtx(); if (!a) return;
    try { if (a.state === 'suspended') a.resume(); tone(a, 560, 260, .1, .18); } catch (err) { /* 沒聲音也沒關係 */ }
  }
  function winSound() {
    if (!settings.sfx) return;
    const a = getCtx(); if (!a) return;
    try {
      if (a.state === 'suspended') a.resume();
      [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(a, f, f * 1.01, .35, .16, 'sine'), i * 140));
    } catch (err) { /* ignore */ }
  }
  // 做法和「井」遊戲一樣：低沉的風聲、遠處的水滴、帶井壁般的長回音；只是水滴出現得比較頻繁
  function reverbImpulse(a, sec, decay) {
    const len = Math.floor(a.sampleRate * sec), buf = a.createBuffer(2, len, a.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }
  function windBuffer(a) {
    const total = a.sampleRate * 8, fade = Math.floor(a.sampleRate * .6), len = total - fade;
    const raw = new Float32Array(total);
    let l = 0;
    for (let i = 0; i < total; i++) { l = (l + .02 * (Math.random() * 2 - 1)) / 1.02; raw[i] = l * 3.5; }   // 布朗噪音
    const buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = raw[i];
    for (let i = 0; i < fade; i++) { const t = i / fade; d[i] = raw[i] * t + raw[len + i] * (1 - t); }   // 首尾接起來，循環不會有「啪」一聲
    return buf;
  }
  function drop(a, out) {
    const t = a.currentTime, f = 650 + Math.random() * 900;
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(f * 1.7, t + .09);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(.22, t + .006);
    g.gain.exponentialRampToValueAtTime(.0001, t + .3);
    o.connect(g); g.connect(out);
    o.start(t); o.stop(t + .35);
  }
  const MUSIC_VOL = .8;
  function startMusic() {
    if (!settings.music || music) return;
    const a = getCtx(); if (!a) return;
    try {
      if (a.state === 'suspended') a.resume();
      const t0 = a.currentTime;
      const bus = a.createGain();
      bus.gain.setValueAtTime(0, t0);
      bus.gain.linearRampToValueAtTime(MUSIC_VOL, t0 + 2);     // 慢慢淡入
      bus.connect(a.destination);
      // 回音（井壁的殘響）
      const conv = a.createConvolver(); conv.buffer = reverbImpulse(a, 3.4, 2.4);
      const wet = a.createGain(); wet.gain.value = .9;
      conv.connect(wet); wet.connect(bus);
      const dropBus = a.createGain();
      const dry = a.createGain(); dry.gain.value = .25;
      dropBus.connect(dry); dry.connect(bus); dropBus.connect(conv);
      // 低沉風聲：布朗噪音 → 低通，音量緩慢起伏
      const src = a.createBufferSource(); src.buffer = windBuffer(a); src.loop = true;
      const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220;
      const wg = a.createGain(); wg.gain.value = .05;
      const lfo = a.createOscillator(); lfo.frequency.value = .07;
      const lg = a.createGain(); lg.gain.value = .02;
      lfo.connect(lg); lg.connect(wg.gain);
      src.connect(lp); lp.connect(wg); wg.connect(bus);
      src.start(); lfo.start();
      const m = music = { a, bus, nodes: [src, lfo], timer: 0 };
      // 水滴：間隔不規律，約 2～7 秒一滴（「井」遊戲是 8～48 秒）
      const next = () => { m.timer = setTimeout(() => { drop(a, dropBus); next(); }, 2000 + Math.random() * 5000); };
      setTimeout(() => { if (music === m) drop(a, dropBus); }, 1200);
      next();
    } catch (err) { music = null; }
  }
  function stopMusic() {
    if (!music) return;
    const m = music; music = null;
    clearTimeout(m.timer);
    try {
      const t = m.a.currentTime;
      m.bus.gain.cancelScheduledValues(t);
      m.bus.gain.setValueAtTime(m.bus.gain.value, t);
      m.bus.gain.linearRampToValueAtTime(0, t + .4);
    } catch (err) { /* ignore */ }
    setTimeout(() => {
      m.nodes.forEach(n => { try { n.stop(); } catch (err) { /* ignore */ } });
      try { m.bus.disconnect(); } catch (err) { /* ignore */ }
    }, 600);
  }
  // 瀏覽器規定要先有點擊或按鍵才能出聲，所以「預設開啟」會在玩家第一次操作時開始
  function unlockAudio() { if (settings.music && !music) startMusic(); }
  window.addEventListener('pointerdown', unlockAudio);
  window.addEventListener('pointerup', unlockAudio);
  window.addEventListener('touchend', unlockAudio);
  window.addEventListener('keydown', unlockAudio);
  document.addEventListener('visibilitychange', () => {
    if (!actx) return;
    if (document.hidden) actx.suspend(); else actx.resume();
  });
  function showSoundButtons() {
    btnMusic.classList.toggle('on', settings.music);
    btnMusic.textContent = settings.music ? '🎵' : '🎵✖';
    btnSound.classList.toggle('on', settings.sfx);
    btnSound.textContent = settings.sfx ? '🔊' : '🔇';
    btnMusic.dataset.lbl = T('musicS'); btnSound.dataset.lbl = T('sfxS');
  }

  /* ---------- 整理拼圖池 ---------- */
  function tidy(mode) {
    if (!G) return;
    const pool = G.pieces.filter(p => p.pool);
    if (!pool.length) return;
    const P = G.P, m = G.m, pw = G.poolW;
    const map = new Map();
    pool.forEach(p => { if (!map.has(p.g)) map.set(p.g, []); map.get(p.g).push(p); });
    const items = [...map.values()].map(mem => {
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      mem.forEach(p => { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x + P); y1 = Math.max(y1, p.y + P); });
      return { mem, x0, y0, w: x1 - x0, h: y1 - y0, type: Math.min(...mem.map(p => p.type)), big: mem.length > 1 };
    });
    items.sort((a, b) => (Math.round(a.y0 / P) - Math.round(b.y0 / P)) || (a.x0 - b.x0));
    items.sort((a, b) => (b.big - a.big));                       // 已拼好的塊先放
    if (mode === 'edges') items.sort((a, b) => (b.big - a.big) || (a.type - b.type));

    const gap = P * .22;
    if (G.bottom) {
      // 下方托盤：先排滿一直行，再換下一行（往右延伸）
      const top = 24 + m + 4, bot = G.trayH - m - 4;
      let cx = 12 + m, cy = top, colW = 0;
      for (const it of items) {
        if (cy + it.h > bot && cy > top) { cx += colW + gap; cy = top; colW = 0; }
        const dx = cx - it.x0, dy = cy - it.y0;
        it.mem.forEach(p => { p.x += dx; p.y += dy; });
        cy += it.h + gap;
        colW = Math.max(colW, it.w);
      }
    } else {
      const left = 8 + m, right = pw - 8 - m;
      let cx = left, cy = 46 + m, rowH = 0;
      for (const it of items) {
        if (cx + it.w > right && cx > left) { cx = left; cy += rowH + gap; rowH = 0; }
        const dx = cx - it.x0, dy = cy - it.y0;
        it.mem.forEach(p => { p.x += dx; p.y += dy; });
        cx += it.w + gap;
        rowH = Math.max(rowH, it.h);
      }
    }
    G.scroll = 0;
    requestDraw();
  }

  /* ---------- 移動次數 ---------- */
  function showMoves() { movesEl.textContent = '👆 ' + (G ? G.moves : 0); }

  /* ---------- 完成畫面與排行榜（Firebase，和其他遊戲共用同一個專案） ---------- */
  const firebaseConfig = {
    apiKey: "AIzaSyC_YSDn2OH6_GKKwCq0d8QFNl3fYXzTC60",
    authDomain: "memorma-24dab.firebaseapp.com",
    projectId: "memorma-24dab",
    storageBucket: "memorma-24dab.firebasestorage.app",
    messagingSenderId: "806709458465",
    appId: "1:806709458465:web:f0d12acb2f911f2f165560"
  };
  let db = null, authReady = Promise.resolve(null), lastResult = null;
  try {
    if (window.firebase) {
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
      authReady = firebase.auth().signInAnonymously().then(c => c.user.uid)
        .catch(err => { console.error('Anonymous sign-in failed:', err); return null; });
    }
  } catch (e) { console.warn('Firebase not available:', e); }

  const nameInput = $('nameInput'), saveMsg = $('saveMsg');
  const rankOv = $('rankOv'), rankList = $('rankList'), rankMsg = $('rankMsg'), rankTabs = $('rankTabs');
  const boardRef = n => db.collection('jigsaw_boards').doc(String(n)).collection('entries');
  // 排名：時間越短越前面，時間一樣比移動次數
  const rankOf = (secs, moves) => (99999 - secs) * 10000 + (9999 - moves);
  const fill = (str, v) => String(str).replace('{t}', v.t).replace('{m}', v.m);

  function renderWinMsg() {
    if (!G) return;
    const w = bi('winMsg'), mv = bi('moves');
    winMsg.innerHTML = '';
    const line = i => `${w[i]}${fmt(G.elapsed)}　${mv[i]}: ${G.moves}`;
    const a = document.createElement('div'); a.textContent = line(0);
    winMsg.appendChild(a);
    if (w[1] && w[1] !== w[0]) {
      const b = document.createElement('small'); b.style.color = '#666'; b.textContent = line(1);
      winMsg.appendChild(b);
    }
  }
  function renderSave() {
    $('saveBtn').disabled = !!(lastResult && (lastResult.saved || lastResult.saving));
    saveMsg.innerHTML = '';
    if (!lastResult || !lastResult.status) return;
    const v = lastResult.old ? { t: fmt(lastResult.old.secs), m: lastResult.old.moves } : { t: '', m: '' };
    const [z, o] = bi(lastResult.status);
    const a = document.createElement('div'); a.textContent = fill(z, v);
    saveMsg.appendChild(a);
    if (o && o !== z) { const b = document.createElement('small'); b.textContent = fill(o, v); saveMsg.appendChild(b); }
  }
  async function saveResult() {
    const r = lastResult;
    if (!r || r.saved || r.saving) return;
    const name = nameInput.value.trim().slice(0, 14);
    if (!name) { r.status = 'nameErr'; renderSave(); return; }
    try { localStorage.setItem('jigsaw_name', name); } catch (e) { /* ignore */ }
    r.saving = true; r.status = 'saving'; renderSave();
    const rank = rankOf(r.secs, r.moves);
    try {
      const uid = await authReady;
      if (!db || !uid) throw new Error('no firebase');
      const ref = boardRef(r.board).doc(uid);
      const snap = await ref.get();
      if (snap.exists && (snap.data().rank || 0) >= rank) {
        r.saved = true; r.status = 'notBetter'; r.old = snap.data();
      } else {
        await ref.set({ name, secs: r.secs, moves: r.moves, text: r.text, rank,
          script: settings.script, lang: settings.lang,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        r.saved = true; r.status = 'saved';
      }
    } catch (err) {
      console.error(err);
      r.status = 'saveFail';
    }
    r.saving = false;
    renderSave();
  }

  let rankSize = 10, rankLevel = 'easy', rankReq = 0;
  function setRankMsg(key) {
    rankMsg.style.display = key ? 'block' : 'none';
    if (key) setBi(rankMsg, key);
  }
  function renderRankTabs() {
    rankTabs.innerHTML = '';
    [8, 10, 12, 15].forEach(n => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = `${n} × ${n}`;
      if (n === rankSize) b.classList.add('active');
      b.addEventListener('click', () => { rankSize = n; renderRankTabs(); loadRank(); });
      rankTabs.appendChild(b);
    });
    const rt2 = $('rankTabs2');
    rt2.innerHTML = '';
    [['easy', 'lvEasy'], ['rot', 'lvRot']].forEach(([v, key]) => {
      const b = document.createElement('button');
      b.type = 'button';
      setBi(b, key);
      if (v === rankLevel) b.classList.add('active');
      b.addEventListener('click', () => { rankLevel = v; renderRankTabs(); loadRank(); });
      rt2.appendChild(b);
    });
  }
  async function loadRank() {
    const req = ++rankReq;
    rankList.innerHTML = '';
    setRankMsg('loading');
    if (!db) { setRankMsg('lbFail'); return; }
    try {
      const uid = await authReady;
      if (!uid) throw new Error('no auth');
      const snap = await boardRef(rankSize + (rankLevel === 'rot' ? 'r' : '')).orderBy('rank', 'desc').limit(10).get();
      if (req !== rankReq) return;
      if (snap.empty) { setRankMsg('lbEmpty'); return; }
      setRankMsg('');
      let rk = 1;
      snap.forEach(doc => {
        const d = doc.data();
        const li = document.createElement('li');
        if (doc.id === uid) li.classList.add('me');
        li.innerHTML = '<span class="rk"></span><span class="nm"><span></span><small></small></span><span class="res"></span>';
        li.querySelector('.rk').textContent = rk++;
        li.querySelector('.nm > span').textContent = String(d.name == null ? '' : d.name);   // 一律當純文字
        li.querySelector('.nm small').textContent = String(d.text == null ? '' : d.text);
        li.querySelector('.res').textContent = `⏱ ${fmt((Number(d.secs) || 0) * 1000)} · 👆 ${Number(d.moves) || 0}`;
        rankList.appendChild(li);
      });
    } catch (err) {
      if (req !== rankReq) return;
      console.error(err);
      setRankMsg('lbFail');
    }
  }
  function openRank() {
    if (G) { rankSize = G.n; rankLevel = G.level; }
    renderRankTabs();
    rankOv.classList.remove('hidden');
    loadRank();
  }

  /* ---------- 遊戲說明 ---------- */
  function renderHelp() {
    const zh = HELP[zhKey()], other = settings.lang === 'zh' ? null : HELP[settings.lang];
    const body = $('helpBody');
    body.innerHTML = '';
    zh.forEach(([title, items], i) => {
      const h = document.createElement('h4');
      h.textContent = title;
      if (other) { const s = document.createElement('small'); s.textContent = other[i][0]; h.appendChild(s); }
      body.appendChild(h);
      const ul = document.createElement('ul');
      items.forEach((txt, j) => {
        const li = document.createElement('li');
        li.textContent = txt;
        if (other) { const s = document.createElement('small'); s.textContent = other[i][1][j]; li.appendChild(s); }
        ul.appendChild(li);
      });
      body.appendChild(ul);
    });
  }

  /* ---------- 套用介面文字 ---------- */
  function applyUI() {
    document.documentElement.lang = settings.script === 'simp' ? 'zh-Hans' : 'zh-Hant';
    document.title = T('title');
    document.querySelectorAll('[data-i]').forEach(el => setBi(el, el.dataset.i));
    inText.placeholder = T('textPh');
    nameInput.placeholder = T('namePh');
    btnMusic.title = T('music');
    btnSound.title = T('sfx');
    showSoundButtons();
    const cur = selGrid.value || '10';
    selGrid.innerHTML = '';
    [8, 10, 12, 15].forEach(n => {
      const o = document.createElement('option');
      o.value = n;
      o.textContent = `${n} × ${n} (${n * n})`;
      selGrid.appendChild(o);
    });
    selGrid.value = cur;
    selLevel.innerHTML = '';
    [['easy', 'lvEasy'], ['rot', 'lvRot']].forEach(([v, key]) => {
      const o = document.createElement('option');
      o.value = v; o.textContent = T(key);
      selLevel.appendChild(o);
    });
    selLevel.value = settings.level;
    renderHelp();
    renderSettings();
    setPinyinMsg(pinyinMsgKey);
    if (G) {
      updateStatus();
      if (G.done) { renderWinMsg(); renderSave(); }
    }
    requestDraw();
  }

  /* ---------- 按鈕 ---------- */
  function begin() {
    if (settings.phon !== 'off') loadPinyin().then(ok => { if (!ok) setPinyinMsg('pinyinFail'); newGame(); });
    else newGame();
  }
  function startNew() {
    if (G && !G.done && !confirm(T('confirmNew'))) return;
    begin();
  }
  btnSet.addEventListener('click', () => { settingsOv.classList.remove('hidden'); });
  $('settingsDone').addEventListener('click', () => settingsOv.classList.add('hidden'));
  settingsOv.addEventListener('click', e => { if (e.target === settingsOv) settingsOv.classList.add('hidden'); });
  btnStart.addEventListener('click', () => { document.body.classList.remove('showNew'); startNew(); });
  inText.addEventListener('keydown', e => { if (e.key === 'Enter') { document.body.classList.remove('showNew'); startNew(); } });
  btnTidy.addEventListener('click', () => tidy('plain'));
  btnEdges.addEventListener('click', () => tidy('edges'));
  btnPreview.addEventListener('click', () => { showPreview = !showPreview; btnPreview.classList.toggle('on', showPreview); requestDraw(); });
  btnFrame.addEventListener('click', () => { showFrame = !showFrame; btnFrame.classList.toggle('on', showFrame); requestDraw(); });
  btnSound.addEventListener('click', () => { settings.sfx = !settings.sfx; saveSettings(); showSoundButtons(); click(); });
  btnMusic.addEventListener('click', () => {
    settings.music = !settings.music; saveSettings(); showSoundButtons();
    if (settings.music) startMusic(); else stopMusic();
  });
  const helpOv = $('helpOv');
  $('btnHelp').addEventListener('click', () => { helpOv.classList.remove('hidden'); });
  $('helpDone').addEventListener('click', () => helpOv.classList.add('hidden'));
  helpOv.addEventListener('click', e => { if (e.target === helpOv) helpOv.classList.add('hidden'); });
  selLevel.addEventListener('change', () => { settings.level = selLevel.value === 'rot' ? 'rot' : 'easy'; saveSettings(); });
  btnRank.addEventListener('click', openRank);
  // 手機版：下方功能列、面板
  const body = document.body;
  const closeSheets = () => body.classList.remove('showNew', 'showMore');
  $('mNew').addEventListener('click', () => { const on = !body.classList.contains('showNew'); closeSheets(); if (on) body.classList.add('showNew'); });
  $('mMore').addEventListener('click', () => { const on = !body.classList.contains('showMore'); closeSheets(); if (on) body.classList.add('showMore'); });
  $('mPool').addEventListener('click', () => { closeSheets(); toggleTray(); });
  $('mPrev').addEventListener('click', () => { closeSheets(); btnPreview.click(); });
  $('mTidy').addEventListener('click', () => { closeSheets(); btnTidy.click(); });
  $('mdim').addEventListener('click', closeSheets);
  $('btnFit').addEventListener('click', () => { if (G && G.mobile) { fitView(); requestDraw(); } });
  document.querySelector('.tools').addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('button');
    if (b && ['btnHelp', 'btnRank', 'btnSet', 'btnEdges'].includes(b.id)) closeSheets();
  });
  $('winRank').addEventListener('click', openRank);
  $('rankDone').addEventListener('click', () => rankOv.classList.add('hidden'));
  rankOv.addEventListener('click', e => { if (e.target === rankOv) rankOv.classList.add('hidden'); });
  $('saveBtn').addEventListener('click', saveResult);
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') saveResult(); });
  if (window.ResizeObserver) new ResizeObserver(() => resize()).observe(stage);   // 標題區高度改變時，桌面跟著調整
  $('winAgain').addEventListener('click', () => { G.done = true; begin(); });
  $('winClose').addEventListener('click', () => winEl.classList.add('hidden'));
  window.addEventListener('resize', resize);

  /* ---------- 開始 ---------- */
  applyUI();
  resize();
  if (settings.phon !== 'off') setPinyinMsg('pinyinLoading');
  begin();
  if (settings.phon !== 'off') loadPinyin().then(ok => setPinyinMsg(ok ? 'pinyinReady' : 'pinyinFail'));
})();
</script>
</body>
